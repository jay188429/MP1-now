const FAQ_KEY="nowFaq",SETTINGS_KEY="nowFaqSettings";const CERTS=["공인중개사(전문자격사)","사회복지사 2급(국가자격)","전기기능사(큐넷 국가기술자격)"];
const rows=[
["공인중개사(전문자격사)","공인중개사 1차 필기 접수 기간과 시험일은 언제인가요?","2026년 제37회 1차 접수기간은 08.03~08.07이며, 시험일은 10.31입니다. (현재 올해 1차 접수는 마감되었습니다)"],["공인중개사(전문자격사)","원서 접수는 몇 시부터 시작되나요?","공인중개사는 전문자격으로 접수 첫날 오전 09:00부터 두두넷 전용 사이트에서 시작됩니다."],["공인중개사(전문자격사)","공인중개사 1차 시험 접수비(응시료)는 얼마인가요?","사내 안내 규정상 응시료 금액이 확인되지 않아 답변해 드릴 수 없습니다. 공식 전용 사이트에서 확인해 주세요."],["공인중개사(전문자격사)","1차 시험에 합격하면 다음 시험에서 1차가 면제되나요?","1차 시험 합격 시 다음 회차 1회에 한해 1차 시험이 면제됩니다. (단, 정확한 규정은 공식 안내를 참조하세요)"],["공인중개사(전문자격사)","2차/실기 시험 접수도 여기서 해주나요?","저희 센터는 필기(1차) 접수만 도와드립니다. 2차 및 실기 관련 안내는 제공하지 않습니다."],["공인중개사(전문자격사)","시험 당일 지참해야 하는 준비물은 무엇인가요?","수험표, 신분증, 필기구(흑색 사인펜)를 반드시 지참하셔야 합니다."],["공인중개사(전문자격사)","시험장에 주차 공간이 지원되나요?","시험장마다 주차 가능 여부가 다르므로 저희가 안내해 드릴 수 없습니다. (모르겠습니다)"],["공인중개사(전문자격사)","접수 후 취소하면 환불은 어떻게 되나요?","접수 기간 내 취소 시 100% 환불되며, 마감 후 시험 5일 전까지는 50% 환불, 시험 4일 전부터는 환불이 불가합니다."],
["사회복지사 2급(국가자격)","사회복지사 2급 필기시험 일정은 어떻게 되나요?","사회복지사 2급은 별도의 필기시험 없이 지정된 학점/과목 이수 및 현장실습으로 취득하는 자격입니다."],["사회복지사 2급(국가자격)","사회복지사 2급 발급 수수료나 접수비는 얼마인가요?","안내 규정에 수수료 금액이 명시되어 있지 않아 정확한 금액은 답변해 드릴 수 없습니다."],["사회복지사 2급(국가자격)","현장실습이나 실기 접수도 여기서 신청받나요?","저희 센터는 국가기술자격 필기 접수 안내 창구로, 사회복지사 현장실습/실기는 접수해 드리지 않습니다."],["사회복지사 2급(국가자격)","사회복지사 2급 이수 과목이나 응시 자격을 가르쳐주세요.","상세 교육 과정 및 응시 자격 조건은 규정에 확인되지 않아 답변하기 어렵습니다. (모르겠습니다)"],["사회복지사 2급(국가자격)","환불 신청을 하면 돈은 언제 들어오나요?","접수 취소 처리 후 환불금 입금까지 최대 7일이 소요되며, 입금자명은 '토스페이먼츠'로 표시됩니다."],["사회복지사 2급(국가자격)","전화나 방문으로 접수할 수 없나요?","원서 접수는 온라인(인터넷/모바일)으로만 가능하며, 방문 접수 및 전화 접수는 진행하지 않습니다."],["사회복지사 2급(국가자격)","등록할 사진의 규격 조건이 어떻게 되나요?","6개월 이내 촬영한 3.5x4.5cm 컬러 상반신 정면 사진(모자/배경 없음)이어야 합니다."],["사회복지사 2급(국가자격)","합격 후 자격증은 언제 나오나요?","자격증 발급 기관 소관 사항으로 저희 센터에서는 안내가 불가능합니다."],
["전기기능사(큐넷 국가기술자격)","전기기능사 필기 원서접수 일정은 언제인가요?","전기기능사는 정기 연 4회 시행되며, 가장 가깝게는 제4회 필기접수(08.24~08.27), 시험일(09.16~09.21)입니다."],["전기기능사(큐넷 국가기술자격)","전기기능사 필기 접수비(응시료)는 얼마인가요?","전기기능사 필기 응시료는 14,500원입니다."],["전기기능사(큐넷 국가기술자격)","필기시험 시간과 시험 방식은 어떻게 되나요?","시험시간은 60분이며, 컴퓨터로 문제를 푸는 CBT 방식으로 진행되어 시험 종료 즉시 합격 여부를 알 수 있습니다."],["전기기능사(큐넷 국가기술자격)","전기기능사 필기에 합격하면 면제 기간이 얼마나 되나요?","국가기술자격법에 따라 필기시험 합격 발표일로부터 2년간 필기시험이 면제됩니다."],["전기기능사(큐넷 국가기술자격)","전기기능사 실기 접수도 같이할 수 있나요?","저희 센터는 필기 접수만 도와드립니다. 실기시험 접수는 직접 큐넷을 통해 진행하셔야 합니다."],["전기기능사(큐넷 국가기술자격)","접수 시작 시간과 가상계좌 입금 기한은 언제인가요?","접수는 첫날 오전 10:00에 시작하며, 가상계좌는 지정된 마감일시 14:00까지 입금해야 자동 취소되지 않습니다."],["전기기능사(큐넷 국가기술자격)","계산기나 휴대폰을 시험장에 가지고 갈 수 있나요?","허용된 지정 공학용 계산기만 사용 가능하며, 휴대폰·스마트워치 등 통신기기는 시험 전 전원을 꺼야 하며 소지 시 무효 처리됩니다."],["전기기능사(큐넷 국가기술자격)","시험장 주차 지원이나 합격 가능 여부를 알려주세요.","시험장 주차 지원 여부 및 개개인의 합격 가능성은 저희가 알 수 없습니다. (모르겠습니다)"]].map((x,i)=>({id:i+1,certificate:x[0],question:x[1],answer:x[2]}));
function getFaq(){let faq=JSON.parse(localStorage.getItem(FAQ_KEY)||"null");if(!faq||faq.length!==24){faq=rows;localStorage.setItem(FAQ_KEY,JSON.stringify(faq))}return faq}function settings(){const saved=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}");return {threshold:saved.threshold||2,synonyms:{응시료:["접수비","시험비","돈 얼마"],필기:["1차","이론","쓰는 거"],굴착기:["포크레인"],지게차운전기능사:["지게차 면허"],사회복지사:["요양사"],...(saved.synonyms||{})}}}function normalize(text){return text.toLowerCase().replace(/[\s.,!?/()]/g,"")}function renderFaq(){const cert=document.querySelector("#certificate").value;const list=document.querySelector("#faqList");list.innerHTML="";getFaq().filter(f=>f.certificate===cert).forEach(f=>{const item=document.createElement("details");item.className="faq-item";const summary=document.createElement("summary");summary.textContent=f.question;const answer=document.createElement("div");answer.className="faq-answer";answer.textContent=f.answer;item.append(summary,answer);list.append(item)})}function ask(question){const text=question.trim();if(!text)return;const chat=document.querySelector("#chat");const user=document.createElement("div");user.className="bubble user";user.textContent=`질문: ${text}`;chat.append(user);const answer=document.createElement("div");answer.className="bubble answer";const lower=text.toLowerCase();if(/실기|2차|실습/.test(lower)){answer.className+=" fallback";answer.textContent="저희 센터는 필기(1차) 접수만 도와드립니다."}else{const cert=document.querySelector("#certificate").value;const config=settings();const expanded=Object.entries(config.synonyms).reduce((value,[key,words])=>value+" "+key+" "+words.join(" "),text);const normalized=normalize(expanded);const candidates=getFaq().filter(f=>f.certificate===cert);let best=null;for(const faq of candidates){const words=normalize(faq.question).match(/[가-힣a-z0-9]{2,}/g)||[];const score=words.reduce((sum,word)=>sum+(normalized.includes(word)?1:0),0);if(!best||score>best.score)best={faq,score}}if(!best||best.score<config.threshold){answer.className+=" fallback";answer.textContent=best&&best.score===1?"공식 홈페이지를 참조해 주세요.":"확인되지 않은 사항입니다. 모르겠습니다."}else answer.textContent=best.faq.answer}chat.append(answer);answer.scrollIntoView({behavior:"smooth",block:"nearest"})}const examples=["접수비가 얼마예요?","필기 시험은 언제예요?","시험장에 주차 되나요?","실기 접수도 해주나요?"];document.querySelector("#examples").innerHTML=examples.map(text=>`<button type="button" class="button" data-question="${text}">${text}</button>`).join("");document.querySelector("#examples").addEventListener("click",event=>{if(event.target.dataset.question){document.querySelector("#question").value=event.target.dataset.question;ask(event.target.dataset.question)}});document.querySelector("#ask").addEventListener("click",()=>{const input=document.querySelector("#question");ask(input.value);input.value=""});document.querySelector("#question").addEventListener("keydown",event=>{if(event.key==="Enter")document.querySelector("#ask").click()});document.querySelector("#certificate").addEventListener("change",renderFaq);renderFaq();
function normalize(text){return text.toLowerCase().replace(/[.,!?/()]/g," ")}
function ask(question){const text=question.trim();if(!text)return;const chat=document.querySelector("#chat");const user=document.createElement("div");user.className="bubble user";user.textContent=`질문: ${text}`;chat.append(user);const answer=document.createElement("div");answer.className="bubble answer";const lower=text.toLowerCase();if(/실기|2차|실습/.test(lower)){answer.className+=" fallback";answer.textContent="저희 센터는 필기(1차) 접수만 도와드립니다."}else{const cert=document.querySelector("#certificate").value;const config=settings();const expanded=Object.entries(config.synonyms).reduce((value,[key,words])=>value+" "+key+" "+words.filter(word=>lower.includes(word.toLowerCase())).join(" "),text);const normalized=normalize(expanded);const candidates=getFaq().filter(f=>f.certificate===cert);let best=null;for(const faq of candidates){const words=normalize(faq.question).match(/[가-힣a-z0-9]{2,}/g)||[];const score=words.reduce((sum,word)=>sum+(normalized.includes(word)?1:0),0);if(!best||score>best.score)best={faq,score}}if(!best||best.score<config.threshold){answer.className+=" fallback";answer.textContent=best&&best.score===1?"공식 홈페이지를 참조해 주세요.":"확인되지 않은 사항입니다. 모르겠습니다."}else answer.textContent=best.faq.answer}chat.append(answer);answer.scrollIntoView({behavior:"smooth",block:"nearest"})}
function ask(question){const text=question.trim();if(!text)return;const chat=document.querySelector("#chat");const user=document.createElement("div");user.className="bubble user";user.textContent=`질문: ${text}`;chat.append(user);const answer=document.createElement("div");answer.className="bubble answer";const lower=text.toLowerCase();if(/실기|2차|실습/.test(lower)){answer.className+=" fallback";answer.textContent="저희 센터는 필기(1차) 접수만 도와드립니다."}else{const cert=document.querySelector("#certificate").value;const config=settings();const expanded=Object.entries(config.synonyms).reduce((value,[key,words])=>value+" "+key+" "+words.filter(word=>lower.includes(word.toLowerCase())).join(" "),text);const queryTokens=new Set(normalize(expanded).match(/[가-힣a-z0-9]{2,}/g)||[]);const candidates=getFaq().filter(f=>f.certificate===cert);let best=null;for(const faq of candidates){const faqTokens=normalize(faq.question).match(/[가-힣a-z0-9]{2,}/g)||[];const score=faqTokens.reduce((sum,word)=>sum+(queryTokens.has(word)?1:0),0);if(!best||score>best.score)best={faq,score}}if(!best||best.score<config.threshold){answer.className+=" fallback";answer.textContent=best&&best.score===1?"공식 홈페이지를 참조해 주세요.":"확인되지 않은 사항입니다. 모르겠습니다."}else answer.textContent=best.faq.answer}chat.append(answer);answer.scrollIntoView({behavior:"smooth",block:"nearest"})}
