<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOW자격지원센터 | 필기 접수 신청</title>
<style>
:root{--ink:#17202a;--muted:#5b6670;--paper:#fffdf8;--blue:#075985;--blue-dark:#064e73;--yellow:#facc15;--line:#cbd5e1;--soft:#e0f2fe;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fefce8 0,#f0f9ff 52%,#ecfdf5 100%);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:18px;line-height:1.6}main{max-width:1080px;margin:auto;padding:28px 18px 60px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:26px}h1,h2{line-height:1.2;margin:0 0 12px}h1{font-size:clamp(28px,4vw,42px)}h2{font-size:28px}.eyebrow{font-weight:800;color:var(--blue);letter-spacing:.04em}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a,.button{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:10px 18px;border:2px solid var(--blue);border-radius:8px;background:var(--blue);color:white;text-decoration:none;font-weight:800;cursor:pointer}.nav a.secondary,.button.secondary{background:white;color:var(--blue)}.hero,.panel{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(23,32,42,.08)}.hero{padding:28px;margin-bottom:20px}.notice{border-left:7px solid var(--yellow);background:#fff7c2;padding:14px 16px;font-weight:700}.panel{padding:24px;margin-top:20px}form{display:grid;gap:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.field{display:grid;gap:7px}label{font-weight:800}input,select,textarea{font:inherit;width:100%;padding:12px 14px;border:2px solid #94a3b8;border-radius:8px;background:white;color:var(--ink);min-height:52px}textarea{min-height:100px;resize:vertical}.help{font-size:16px;color:var(--muted)}.full{grid-column:1/-1}.certificate-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.certificate-list label{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:8px;padding:14px;background:white;cursor:pointer;min-height:72px}.certificate-list label:has(input:checked){border-color:var(--blue);background:var(--soft)}input[type=radio]{width:24px;min-height:24px;accent-color:var(--blue)}.status{padding:14px;border-radius:8px;background:#ecfdf5;border:1px solid #86efac;font-weight:800}.status.error{background:#fff1f2;border-color:#fda4af;color:var(--danger)}footer{margin-top:28px;color:var(--muted);font-size:16px}@media(max-width:720px){main{padding:18px 12px 40px}.grid,.certificate-list{grid-template-columns:1fr}.panel,.hero{padding:18px}.nav a{flex:1}.button{width:100%}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">NOW자격지원센터</div><h1>필기(1차) 접수 신청</h1></div><nav class="nav" aria-label="주요 메뉴"><a href="index.html">접수 신청</a><a class="secondary" href="admin/index.html">관리자</a><a class="secondary" href="faq/index.html">FAQ 챗봇</a></nav></header>
<section class="hero"><h2>필기 접수 준비를 도와드립니다</h2><p>아래 신청서를 작성하면 접수 담당자가 확인합니다. 이 서비스는 필기 또는 1차 접수만 지원합니다.</p><div class="notice">실기·2차·실습 접수는 지원하지 않습니다.</div></section>
<section class="panel"><h2>신청서</h2><form id="applicationForm">
<div class="field full"><label>선택 자격증 <span aria-hidden="true">*</span></label><div class="certificate-list"><label><input type="radio" name="certificate" value="공인중개사(전문자격사)" required>공인중개사<br>(전문자격사)</label><label><input type="radio" name="certificate" value="사회복지사 2급(국가자격)">사회복지사 2급<br>(국가자격)</label><label><input type="radio" name="certificate" value="전기기능사(큐넷 국가기술자격)">전기기능사<br>(큐넷 국가기술자격)</label></div></div>
<div class="grid"><div class="field"><label for="name">이름 *</label><input id="name" name="name" autocomplete="name" required></div><div class="field"><label for="phone">연락처 *</label><input id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="010-1234-5678" required><div class="help">숫자만 입력해도 하이픈을 넣어 드립니다.</div></div><div class="field"><label for="birth">생년월일 *</label><input id="birth" name="birth" type="date" required></div><div class="field"><label for="route">접수경로</label><select id="route" name="route"><option value="">선택 안 함</option><option>온라인</option><option>전화</option><option>방문</option></select></div><div class="field full"><label for="address">주소 *</label><input id="address" name="address" autocomplete="street-address" required></div><div class="field full"><label for="note">비고</label><textarea id="note" name="note" placeholder="담당자에게 전할 내용을 적어 주세요."></textarea></div></div>
<button class="button" type="submit">접수 신청 저장하기</button><div id="result" role="status" aria-live="polite"></div></form></section>
<footer>저장된 신청은 이 브라우저의 관리자 화면에서 확인할 수 있습니다. 실제 원서 접수 완료 여부는 담당자 확인 후 진행됩니다.</footer>
</main>
<script>
const STORAGE_KEY="nowApplications";
const form=document.querySelector("#applicationForm");
const phone=document.querySelector("#phone");
const result=document.querySelector("#result");
phone.addEventListener("input",()=>{const digits=phone.value.replace(/\D/g,"").slice(0,11);phone.value=digits.length>7?digits.replace(/(\d{3})(\d{4})(\d{1,4})/,"$1-$2-$3"):digits.length>3?digits.replace(/(\d{3})(\d{1,4})/,"$1-$2"):digits});
form.addEventListener("submit",event=>{event.preventDefault();const data=new FormData(form);const application={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:data.get("name").trim(),phone:data.get("phone"),certificate:data.get("certificate"),birth:data.get("birth"),address:data.get("address").trim(),receivedAt:new Date().toISOString(),status:"접수대기",route:data.get("route"),note:data.get("note").trim()};const applications=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");applications.unshift(application);localStorage.setItem(STORAGE_KEY,JSON.stringify(applications));result.className="status";result.textContent=`접수 신청이 저장되었습니다. 접수일시: ${new Date(application.receivedAt).toLocaleString("ko-KR")}`;form.reset();window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})});
</script>
</body>
</html>
