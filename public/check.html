<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOW자격지원센터 | 접수 확인</title>
<style>
:root{--ink:#24343b;--muted:#5f7077;--blue:#315b72;--blue-dark:#24485d;--line:#d7d8d2;--soft:#e7f0ef;--cream:#fffdf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#fffdf8 0,#f7f4ed 52%,#edf3f0 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:18px;line-height:1.6}main{width:min(100% - 32px,820px);margin:auto;padding:44px 0 70px}.eyebrow{color:var(--blue);font-weight:800;font-size:15px}h1{margin:8px 0 12px;font-size:clamp(32px,5vw,48px);line-height:1.2}h2{margin:0 0 10px;font-size:28px}.lead{margin:0;color:var(--muted)}.panel{margin-top:28px;padding:30px;border:1px solid var(--line);border-radius:22px;background:rgba(255,253,248,.9);box-shadow:0 14px 40px #24343b14}.lookup-form{display:flex;align-items:end;gap:12px;margin-top:24px}.field{display:grid;gap:7px;flex:1}label{font-weight:750;font-size:16px}input{width:100%;min-height:54px;padding:12px 15px;border:1px solid #c7cbc6;border-radius:12px;background:#fff;font:inherit;color:var(--ink)}input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px #315b7230}.button{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:11px 20px;border:0;border-radius:999px;background:var(--blue);color:#fff;font:inherit;font-weight:750;cursor:pointer}.button:hover{background:var(--blue-dark)}.button.secondary{background:#fff;color:var(--blue);border:1px solid var(--line)}.result{margin-top:22px}.result-card{padding:22px;border:1px solid var(--line);border-radius:16px;background:#fff}.result-card h3{margin:0 0 16px;font-size:23px}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.details div{padding:13px;border-radius:10px;background:#f3f6f3}.details span{display:block;color:var(--muted);font-size:14px}.details strong{display:block;margin-top:3px;font-size:18px}.ticket-ready{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:15px;border-radius:12px;background:#e5f1e9;color:#285b46;font-weight:750}.help{margin:14px 0 0;color:var(--muted);font-size:15px}.error{padding:14px;border-radius:12px;background:#fff0ef;color:#a94442;font-weight:700}.back{display:inline-block;margin-top:22px;color:var(--blue);font-weight:750;text-decoration:none}@media(max-width:620px){main{padding-top:28px}.panel{padding:21px}.lookup-form{align-items:stretch;flex-direction:column}.lookup-form .button{width:100%}.details{grid-template-columns:1fr}.ticket-ready{align-items:stretch;flex-direction:column}.ticket-ready .button{width:100%}}
</style>
</head>
<body>
<main>
<div class="eyebrow">NOW자격지원센터</div><h1>접수 확인하기</h1><p class="lead">접수할 때 입력한 전화번호로 접수내용과 현재 상태를 확인할 수 있습니다.</p>
<section class="panel"><h2>접수한 연락처를 입력해 주세요</h2><p class="lead">수험표가 발급되면 이 화면에서 바로 인쇄할 수 있습니다.</p><form class="lookup-form" id="checkForm"><div class="field"><label for="phone">연락처</label><input id="phone" inputmode="tel" autocomplete="tel" required placeholder="010-1234-5678"></div><button class="button" type="submit">접수내용 확인</button></form><div class="result" id="result" role="status" aria-live="polite"></div></section>
<a class="back" href="/">← 접수하기로 돌아가기</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ozducztaqcxpomomggve.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96ZHVjenRhcWN4cG9tb21nZ3ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwODI3MTMsImV4cCI6MjEwMjY1ODcxM30.tKdLUEkzqMYmSgB2sfgwdqEp3fkEy2yjP7GGEWY7Sxo";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const phoneInput = document.querySelector('#phone');
const result = document.querySelector('#result');
function formatPhone(value){const cleaned=value.replace(/\D/g,'');if(cleaned.length<=3)return cleaned;if(cleaned.length<=7)return `${cleaned.slice(0,3)}-${cleaned.slice(3)}`;return `${cleaned.slice(0,3)}-${cleaned.slice(3,7)}-${cleaned.slice(7,11)}`}
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function printExamTicket(app){const printWindow=window.open('','_blank','width=760,height=900');if(!printWindow){alert('인쇄 창이 차단되었습니다. 브라우저에서 팝업을 허용해 주세요.');return}const date=new Date(app.received_at).toLocaleDateString('ko-KR');printWindow.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>수험표 - ${escapeHtml(app.name)}</title><style>body{font-family:Arial,"Noto Sans KR",sans-serif;color:#24343b;padding:40px}.ticket{max-width:640px;margin:auto;border:2px solid #315b72;border-radius:18px;padding:30px}.brand{color:#315b72;font-weight:800}.title{text-align:center;margin:28px 0;font-size:30px}.row{display:flex;border-bottom:1px solid #d7d8d2;padding:14px 0}.label{width:130px;color:#5f7077}.value{font-weight:700}.notice{margin-top:24px;padding:15px;background:#f4e7bf;border-radius:10px}@media print{body{padding:0}.ticket{border:2px solid #315b72}}</style></head><body><article class="ticket"><div class="brand">NOW자격지원센터</div><h1 class="title">수험표</h1><div class="row"><span class="label">성명</span><span class="value">${escapeHtml(app.name)}</span></div><div class="row"><span class="label">응시 종목</span><span class="value">${escapeHtml(app.certificate)}</span></div><div class="row"><span class="label">연락처</span><span class="value">${escapeHtml(app.phone)}</span></div><div class="row"><span class="label">접수일</span><span class="value">${date}</span></div><div class="row"><span class="label">접수 상태</span><span class="value">수험표 발급</span></div><div class="notice">시험 당일에는 신분증과 수험표를 함께 지참해 주세요.</div></article><script>window.onload=()=>window.print();<\/script></body></html>`);printWindow.document.close()}
function render(app){const date=new Date(app.received_at).toLocaleDateString('ko-KR');const status=app.status||'접수대기';const ready=status.includes('수험표');result.innerHTML=`<div class="result-card"><h3>접수내용 확인</h3><div class="details"><div><span>이름</span><strong>${escapeHtml(app.name)}</strong></div><div><span>연락처</span><strong>${escapeHtml(app.phone)}</strong></div><div><span>신청 자격증</span><strong>${escapeHtml(app.certificate)}</strong></div><div><span>성별</span><strong>${escapeHtml(app.gender||'미입력')}</strong></div><div><span>희망 지역</span><strong>${escapeHtml(app.region||'미입력')}</strong></div><div><span>접수일</span><strong>${date}</strong></div></div><div class="ticket-ready"><span>현재 상태: ${escapeHtml(status)}</span>${ready?`<button class="button" type="button" onclick='printExamTicket(${JSON.stringify(app).replace(/'/g,'&#39;')})'>수험표 인쇄</button>`:''}</div><p class="help">${ready?'수험표를 인쇄해 시험 당일 신분증과 함께 지참해 주세요.':'수험표가 발급되면 이곳에 인쇄 버튼이 나타납니다.'}</p></div>`}
phoneInput.addEventListener('input',e=>e.target.value=formatPhone(e.target.value));
document.querySelector('#checkForm').addEventListener('submit',async e=>{e.preventDefault();const phone=phoneInput.value.replace(/\D/g,'');result.textContent='조회 중입니다...';try{const {data,error}=await supabaseClient.from('applications').select('*').eq('phone',phone);if(error)throw error;if(!data||!data.length){result.innerHTML='<div class="error">입력하신 연락처로 접수한 기록이 없습니다.</div>';return}render(data[0])}catch(error){result.innerHTML='<div class="error">조회 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.</div>'}});
</script>
</body>
</html>
