<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ 챗봇 | NOW자격지원센터</title>
<style>
:root{--ink:#17202a;--muted:#5b6670;--paper:#fffdf8;--blue:#075985;--blue-dark:#064e73;--yellow:#facc15;--line:#cbd5e1;--soft:#e0f2fe;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fefce8 0,#f0f9ff 52%,#ecfdf5 100%);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6}main{max-width:900px;margin:auto;padding:28px 18px 60px}header{margin-bottom:26px}h1{font-size:32px;margin:0;font-weight:700}h2{font-size:20px;margin:20px 0 12px}#chatContainer{background:white;border-radius:12px;box-shadow:0 8px 24px rgba(23,32,42,.08);display:flex;flex-direction:column;height:600px;overflow:hidden}#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.message{padding:12px 16px;border-radius:8px;max-width:80%}.message.user{background:var(--blue);color:white;align-self:flex-end}.message.bot{background:#f0f0f0;color:var(--ink);align-self:flex-start}.message.error{background:#ffe0e0;color:var(--danger)}.source{font-size:12px;color:var(--muted);margin-top:4px}#inputArea{display:flex;gap:8px;padding:16px;border-top:1px solid var(--line)}#messageInput{flex:1;padding:12px;border:2px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit}#sendBtn{padding:12px 24px;background:var(--blue);color:white;border:none;border-radius:8px;font-weight:800;cursor:pointer;min-width:80px}#sendBtn:hover{background:var(--blue-dark)}.loading{display:inline-block;width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main>
<header>
<h1>자격증 FAQ 챗봇</h1>
<p style="color:var(--muted);margin:4px 0 0">자격증 시험 접수 관련 질문에 답변합니다</p>
</header>

<div id="chatContainer">
<div id="messages"></div>
<div id="inputArea">
<input type="text" id="messageInput" placeholder="질문을 입력하세요..." autocomplete="off">
<button id="sendBtn" type="button">전송</button>
</div>
</div>
</main>

<script>
const API_URL = '/api/faq';
const messagesDiv = document.querySelector('#messages');
const messageInput = document.querySelector('#messageInput');
const sendBtn = document.querySelector('#sendBtn');

function addMessage(text, isUser = false, source = '') {
  const div = document.createElement('div');
  div.className = `message ${isUser ? 'user' : 'bot'}`;
  div.innerHTML = text;
  if (source) {
    const sourceDiv = document.createElement('div');
    sourceDiv.className = 'source';
    sourceDiv.textContent = source;
    div.appendChild(sourceDiv);
  }
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

async function sendMessage() {
  const message = messageInput.value.trim();
  if (!message) return;

  addMessage(message, true);
  messageInput.value = '';
  sendBtn.disabled = true;

  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'message bot';
  loadingDiv.innerHTML = '<div class="loading"></div>';
  messagesDiv.appendChild(loadingDiv);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message })
    });

    messagesDiv.removeChild(loadingDiv);

    if (!response.ok) throw new Error('API 오류');
    
    const result = await response.json();
    addMessage(result.answer, false, result.source);
  } catch (error) {
    messagesDiv.removeChild(loadingDiv);
    addMessage(`오류: ${error.message}`, false);
  } finally {
    sendBtn.disabled = false;
    messageInput.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
messageInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});

// 초기 인사말
setTimeout(() => {
  addMessage('안녕하세요! 자격증 시험 접수 관련 질문에 답변해드립니다. 무엇을 도와드릴까요?', false);
}, 300);
</script>
</body>
</html>
